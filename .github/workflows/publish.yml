name: Publish
# A tag v<version> publishes the cf-opencode package to npm with trusted publishing (OIDC).
# No npm token exists: npm trusts this workflow file in this repository.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The tag must be the package version
        run: |
          version=$(node -p "require('./cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Failed: tag $GITHUB_REF_NAME is not v$version — fix: tag the commit that sets the version" >&2
            exit 1
          fi
      - run: npm publish -w cli --access public
