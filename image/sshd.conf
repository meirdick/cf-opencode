# cf-opencode: sshd runs only as `sshd -i`, started by the Worker behind the workspace password.
PermitRootLogin no
AllowUsers user
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
AllowTcpForwarding yes
X11Forwarding no
PrintMotd no
# Non-interactive commands (`ssh host cmd`, herdr's remote setup) read no profile, so put
# ~/.local/bin, where herdr and similar tools install themselves, on PATH here.
# GH_TOKEN is a placeholder for gh; the Worker adds the real token on the way out.
SetEnv PATH=/home/user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GH_TOKEN=cf-opencode-egress
